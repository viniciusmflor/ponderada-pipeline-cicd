name: CI Pipeline
on:
  push:
    branches: [main, experimento-cicd]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Executar flake8
        run: flake8 app/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Executar testes
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml 2>&1 | tee pytest-output.txt || true
      - name: Gerar metricas dos testes
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, json, os

          metrics = {'test_count': 0, 'test_failures': 0, 'test_passed': 0,
                     'avg_test_time_ms': 0, 'total_duration_s': 0}

          if os.path.exists('test-results.xml'):
              tree = ET.parse('test-results.xml')
              root = tree.getroot()
              ts = root.find('.//testsuite') or root
              tests = int(ts.get('tests', 0))
              failures = int(ts.get('failures', 0))
              errors = int(ts.get('errors', 0))
              duration = float(ts.get('time', 0))

              metrics = {
                  'test_count': tests,
                  'test_failures': failures + errors,
                  'test_passed': tests - failures - errors,
                  'avg_test_time_ms': round((duration * 1000 / tests), 2) if tests > 0 else 0,
                  'total_duration_s': round(duration, 2)
              }

          with open('test-metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)
          print(f\"Metricas: {metrics['test_count']} testes, {metrics['test_failures']} falhas, avg {metrics['avg_test_time_ms']}ms\")
          "
      - name: Upload artefato de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            test-metrics.json
            pytest-output.txt
          retention-days: 90
